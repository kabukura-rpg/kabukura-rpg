<!doctype html><meta charset="utf-8"><title>audio check</title>
<style>body{font:16px/1.6 sans-serif;padding:24px}button{font-size:28px;padding:20px 40px}pre{white-space:pre-wrap}</style>
<h1>Safari 音声診断</h1>
<button id="go">ここを押してください</button>
<pre id="out"></pre>
<script>
const out = document.getElementById("out");
function log(tag, val){
  const line = tag + " = " + val;
  out.textContent += line + "\n";
  new Image().src = "/__LOG?" + encodeURIComponent(line) + "&t=" + Date.now() + Math.random();
}
let ctx = null;

(async () => {
  log("UA", navigator.userAgent);
  log("protocol", location.protocol);
  log("AudioContext", typeof window.AudioContext);
  log("webkitAudioContext", typeof window.webkitAudioContext);
  try { log("localStorage", localStorage.getItem("kabukura-rpg-best")); }
  catch(e){ log("localStorage", "ERROR " + e); }

  const C = window.AudioContext || window.webkitAudioContext;
  try { ctx = new C(); } catch(e){ log("new AudioContext", "ERROR " + e); return; }
  log("state(生成直後)", ctx.state);
  log("sampleRate", ctx.sampleRate);

  // ジェスチャなしの resume
  try { await ctx.resume(); log("state(resume/ジェスチャなし)", ctx.state); }
  catch(e){ log("resume(ジェスチャなし)", "ERROR " + e); }

  // fetch
  let buf = null;
  try {
    const r = await fetch("assets/se_type.mp3");
    log("fetch", r.status + " ok=" + r.ok);
    buf = await r.arrayBuffer();
    log("arrayBuffer", buf.byteLength + " bytes");
  } catch(e){ log("fetch", "ERROR " + e); }

  // decodeAudioData（Promise 形式）
  if (buf) {
    try {
      const d = await ctx.decodeAudioData(buf.slice(0));
      log("decodeAudioData(Promise)", "OK " + d.duration.toFixed(3) + "s ch=" + d.numberOfChannels);
      window.__buf = d;
    } catch(e){ log("decodeAudioData(Promise)", "ERROR " + e); }
  }
})();

document.getElementById("go").addEventListener("click", async () => {
  log("--- ジェスチャあり ---", "click");
  log("state(クリック直後)", ctx.state);
  const p = ctx.resume();
  log("state(resume 呼出直後・同期)", ctx.state);
  try { await p; log("state(resume 完了後)", ctx.state); }
  catch(e){ log("resume(ジェスチャあり)", "ERROR " + e); }

  if (window.__buf) {
    try {
      const n = ctx.createBufferSource(), g = ctx.createGain();
      n.buffer = window.__buf; g.gain.value = 1.0;
      n.connect(g).connect(ctx.destination);
      n.start();
      log("start()", "呼べた（音が聞こえましたか）");
      setTimeout(()=>log("state(1秒後)", ctx.state), 1000);
    } catch(e){ log("start()", "ERROR " + e); }
  } else {
    log("start()", "バッファなし＝再生できず");
  }
});
</script>
